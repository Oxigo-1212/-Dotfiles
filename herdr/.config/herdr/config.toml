# Migrated from ~/.config/tmux/tmux.conf

onboarding = false

[theme]
# Follow the terminal palette (Noctalia sets Ghostty's colors).
name = "terminal"

[ui]
prompt_new_tab_name = false   # tmux `c` did not prompt

[keys]
prefix = "ctrl+s"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
previous_tab = "alt+shift+h"
next_tab = ["prefix+n", "alt+shift+l"]
goto = "prefix+o"                         # was tmux-sessionx on prefix+o
open_notification_target = "prefix+shift+o"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "~/.config/tmux/scripts/tmux-pdf-search.sh"
description = "PDF search"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "~/.config/herdr/scripts/sessionizer"
description = "sessionizer"
width = "80%"
height = "60%"
