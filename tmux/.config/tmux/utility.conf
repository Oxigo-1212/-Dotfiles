# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Run Codex in a separate session
bind -r r run-shell " \
  SESSION=\"codex-\$(printf '%s' '#{pane_current_path}' | cksum | cut -d' ' -f1 | cut -c1-8)\"; \
  tmux has-session -t \"\$SESSION\" 2>/dev/null || \
  tmux new-session -d -s \"\$SESSION\" -c '#{pane_current_path}' 'codex'; \
  tmux display-popup -w80% -h80% -E \"tmux attach-session -t \$SESSION\" \
"

# Run Oh My Pi (antigravity) in a separate session
bind -r m run-shell " \
  SESSION=\"agy-\$(printf '%s' '#{pane_current_path}' | cksum | cut -d' ' -f1 | cut -c1-8)\"; \
