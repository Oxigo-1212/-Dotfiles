set -gq allow-passthrough on
set -g default-terminal "${TERM}"
set-window-option -g automatic-rename off
set-window-option -g allow-rename off
set-option -g default-terminal "screen-256color"

# set -g status off
set -g mouse on 
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
unbind C-b
set -g prefix C-s
bind C-s send-prefix
# Unbind the default split keys
unbind %
unbind '"'

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g @vim_navigator_mapping_left "C-h"  
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
# Bind new keys for splitting panes
# Split pane vertically
bind | split-window -h -c "#{pane_current_path}"

# Split pane horizontally
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind z resize-pane -Z

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window
bind p display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/tmux-pdf-search.sh"
bind C-f neww "~/.config/tmux/scripts/tmux-sessionizer"


# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'vaaleyard/tmux-dotbar'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore "on"
set -g @resurrect-processes 'opencode'

set -g status-style bg=black,fg=cyan
set -g popup-style bg=default,fg=default
set -g popup-border-style fg=default
set -g status-right "#[bg=#{@thm_bg}]#[fg=#{@thm_rosewater}] 󰖩 #{wifi_ssid} #{wifi_strength} #{battery_status_bg} Battery:  #{battery_percentage} #{battery_remain} #(TZ='Asia/Jakarta' date +'%a %h-%d %H:%M') "
set -g status-right-length 100
set -g status-position bottom
set -g status-justify left

# Enable automatic renaming based on the running process
set-window-option -g automatic-rename on

# Optional: Set the format of the window name (e.g., "0:nvim")
set-window-option -g window-status-current-format "#I:#W#F"
set-window-option -g window-status-format "#I:#W#F"


# source-file -q ~/.cache/noctalia/tmux-colors.conf
# set -g @tmux-dotbar-bold-current-window true
# set -g @tmux-dotbar-right true
# set -g @tmux-dotbar-status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg-session}] %H:%M "
# set -g @tmux-dotbar-position bottom

# Mode styling
set-option -ga update-environment " TZ WAYLAND_DISPLAY XDG_RUNTIME_DIR"
set-environment -g TZ "Asia/Jakarta"

set -g mouse on
set -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

run '~/.config/tmux/.tmux/plugins/tpm/tpm'
source ~/.config/tmux/utility.conf
run-shell '/home/oxigo/projects/tmux-claude-session-manager/claude_session_manager.tmux'
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
