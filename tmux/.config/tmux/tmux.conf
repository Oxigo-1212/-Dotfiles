set -gq allow-passthrough on
set -g default-terminal "${TERM}"
set-window-option -g automatic-rename off
set-window-option -g allow-rename off
set-option -g default-terminal "screen-256color"

# set -g status off
set -g mouse on 
unbind C-b
set -g prefix C-s
bind C-s send-prefix
# Unbind the default split keys
unbind %
unbind '"'

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g @vim_navigator_mapping_left "C-h"  
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
# Bind new keys for splitting panes
# Split pane vertically
bind | split-window -h -c "#{pane_current_path}"

# Split pane horizontally
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind z resize-pane -Z

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window
bind p display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/tmux-pdf-search.sh"
bind C-f neww "~/.config/tmux/scripts/tmux-sessionizer"


# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore "on"
set -g @resurrect-processes 'opencode'

# set -g status-style bg=black,fg=cyan
# set -g status-right "#[bg=#{@thm_bg}]#[fg=#{@thm_rosewater}] 󰖩 #{wifi_ssid} #{wifi_strength} #{battery_status_bg} Battery:  #{battery_percentage} #{battery_remain} #(TZ='Asia/Jakarta' date +'%a %h-%d %H:%M') "
# set -g status-position bottom

# Enable automatic renaming based on the running process
set-window-option -g automatic-rename on

# Optional: Set the format of the window name (e.g., "0:nvim")
set-window-option -g window-status-current-format "#I:#W#F"
set-window-option -g window-status-format "#I:#W#F"


source-file -q ~/.cache/noctalia/tmux-colors.conf
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=#{@tmux-dotbar-bg},fg=#{@tmux-dotbar-fg-session}] %H:%M "
set -g @tmux-dotbar-position top

# Mode styling
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
source ~/.config/tmux/utility.conf
