# tmux-sessionizer configuration file
# file: ~/.config/tmux/tmux-sessionizer/tmux-sessionizer.conf

# Search in home directory with max depth of 3
TS_SEARCH_PATHS=(~/:3)

# Set default search depth to 3
TS_MAX_DEPTH=3

# Optional: Add session commands for quick access
# Usage: tmux-sessionizer -s 0 (runs first command in window 69)
# TS_SESSION_COMMANDS=(
#     "btop"
#     "lazygit"
#     "npm run dev"
# )

# Optional: Enable logging
# TS_LOG=true
# TS_LOG_FILE="$HOME/.local/share/tmux-sessionizer/tmux-sessionizer.logs"
